services:
  postgres:
    image: postgres:16-alpine
    container_name: gossip-postgres-local
    environment:
      POSTGRES_USER: gossip_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: gossip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gossip -d gossip"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: gossip-adminer-local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
