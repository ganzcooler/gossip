services:
  app:
    build: .
    container_name: gossip-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /home/sehrcooler/gossip-articles:/app/articles
      - ./logs:/app/logs
    networks:
      - internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gossip.rule=Host(`gossip.dano1.de`)"
      - "traefik.http.routers.gossip.entrypoints=web"
      - "traefik.http.services.gossip.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik-proxy" # Fix

  postgres:
    image: postgres:16
    container_name: gossip-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
      - gossip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  traefik-proxy:
    external: true
  gossip-net:
    external: true